[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "branchsafe-kv"
version = "0.1.0"
description = "Bounded transactional copy-on-write KV storage for branch decoding research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["numpy==2.3.3"]

[project.scripts]
branchsafe = "branchsafe.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.1", "mypy==1.18.2", "build==1.3.0", "hatchling==1.27.0", "matplotlib==3.10.6", "psutil==7.1.0", "types-psutil==7.0.0.20250822"]
model = ["torch==2.8.0", "transformers==4.56.2", "safetensors==0.6.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/branchsafe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: whole workflow / 完整流程", "model: optional pretrained model / 可选预训练模型"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/branchsafe"]
